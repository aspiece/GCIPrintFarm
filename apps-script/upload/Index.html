<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">
  <style>
    body { font: 1rem/1.5 system-ui, sans-serif; max-width: 36rem; margin: 2rem auto; padding: 0 1rem; color: #17212b; }
    label, button { display: block; margin-top: 1rem; }
    button { padding: .7rem 1rem; background: #164d76; color: white; border: 0; border-radius: .4rem; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .result { padding: 1rem; margin-top: 1rem; background: #eef5fa; border-radius: .4rem; overflow-wrap: anywhere; }
    .error { background: #fff0ef; }
    .return-link { display: inline-block; margin: .75rem 0; padding: .7rem 1rem; background: #164d76; color: white; border-radius: .4rem; text-decoration: none; }
  </style>
</head>
<body data-form-type="<?= formType ?>" data-state="<?= state ?>">
  <h1>Upload a print file</h1>
  <p>Sign in with any Google account, then choose an STL, 3MF, OBJ, STEP, or STP file, up to 25 MB. After uploading, return to your request form to attach the file. Your file is stored in the Print Lab’s Drive folder.</p>
  <form id="upload-form">
    <label for="printFile">Print file</label>
    <input id="printFile" name="printFile" type="file" accept=".stl,.3mf,.obj,.step,.stp" required>
    <button id="upload-button" type="submit">Upload file</button>
  </form>
  <div id="result" role="status" aria-live="polite"></div>
  <script>
    var form = document.getElementById('upload-form');
    var fileInput = document.getElementById('printFile');
    var button = document.getElementById('upload-button');
    var result = document.getElementById('result');
    form.addEventListener('submit', function (event) {
      event.preventDefault();
      var file = fileInput.files[0];
      if (!file) return;
      if (file.size === 0 || file.size > 25 * 1024 * 1024) {
        result.className = 'result error';
        result.textContent = 'Choose a file between 1 byte and 25 MB.';
        return;
      }
      button.disabled = true;
      result.className = 'result';
      result.textContent = 'Uploading…';
      google.script.run
        .withSuccessHandler(function (uploaded) {
          button.disabled = false;
          result.textContent = '';
          var message = document.createElement('p');
          var formType = document.body.dataset.formType;
          var state = document.body.dataset.state;
          message.textContent = uploaded.name + ' is uploaded.';
          var link = document.createElement('a');
          link.href = uploaded.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = uploaded.url;
          result.appendChild(message);
          if (formType && state) {
            var returnLink = document.createElement('a');
            returnLink.className = 'return-link';
            returnLink.href = 'https://print.geneseelearninglab.com/requests.html?upload-return=' +
              encodeURIComponent(state) + '#upload=' +
              encodeURIComponent(uploaded.url) + '&form=' + encodeURIComponent(formType) +
              '&state=' + encodeURIComponent(state);
            returnLink.textContent = 'Return to request form';
            result.appendChild(returnLink);
          }
          var fallback = document.createElement('p');
          fallback.textContent = 'If your request form does not fill automatically, copy this file link into its File Link field:';
          result.appendChild(fallback);
          result.appendChild(link);
        })
        .withFailureHandler(function (error) {
          button.disabled = false;
          result.className = 'result error';
          result.textContent = error.message || 'Upload failed. Please try again.';
        })
        .uploadPrintFile(form);
    });
  </script>
</body>
</html>
